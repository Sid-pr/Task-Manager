{% extends "base.html" %}

{% block content %}

<h2 class="mb-4">Dashboard</h2>

<div class="row">

<div class="col-md-3">
<div class="card text-white bg-primary mb-3">
<div class="card-body">
<h5>Total Tasks</h5>
<h2>{{ total_tasks }}</h2>
</div>
</div>
</div>


<div class="col-md-3">
<div class="card text-white bg-success mb-3">
<div class="card-body">
<h5>Completed</h5>
<h2>{{ completed_tasks }}</h2>
</div>
</div>
</div>


<div class="col-md-3">
<div class="card text-white bg-warning mb-3">
<div class="card-body">
<h5>Pending</h5>
<h2>{{ pending_tasks }}</h2>
</div>
</div>
</div>


<div class="col-md-3">
<div class="card text-white bg-danger mb-3">
<div class="card-body">
<h5>Overdue</h5>
<h2>{{ overdue_tasks }}</h2>
</div>
</div>
</div>

</div>


<a href="/tasks/" class="btn btn-dark mt-3">
View All Tasks
</a>

{% endblock %}
